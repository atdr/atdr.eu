name: ci

# The one answer to "does this change break anything?": lint, links.json
# validation and the Suri build, on every Node line in LTS. It runs on pull
# requests, and deploy.yml calls it on every push to main before publishing,
# so a commit pushed straight to main is checked once, by the deploy, and
# nothing reaches gh-pages without passing.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Pull requests share a group per branch, so a new push cancels the run it
# supersedes. A run called from deploy.yml gets a group of its own, keyed by
# the deploy run, so it never waits on the deploy group itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    uses: atdr/github-boilerplate/.github/workflows/node-ci.yml@v1.1.0
    with:
      # Each must exist in package.json; a missing one fails the job.
      scripts: lint validate build
      # No tests, so nothing to cover.
      coverage: false

  # The one check the ruleset requires from this workflow. The Node matrix
  # follows LTS, so requiring its jobs by name would break the ruleset every
  # time a line enters or leaves LTS.
  gate:
    name: ci gate
    # Not always(): a run superseded by a newer one is cancelled, and its gate
    # would report a failure on the same commit the newer run is checking.
    if: ${{ !cancelled() }}
    needs: [node]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::a required job finished as $result"; exit 1 ;;
            esac
          done
