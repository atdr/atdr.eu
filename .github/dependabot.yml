version: 2
updates:
  # Major-tag pins (@v7) absorb minor and patch releases on their own but never
  # cross a major; this surfaces new majors as PRs. It also bumps the
  # atdr/github-boilerplate reusable workflows, which are pinned to exact tags.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    # A new release waits out GitHub's default three days before Dependabot
    # offers it, time for a compromised one to be caught and pulled. atdr's own
    # actions skip the wait: there is no third party to wait on, and a
    # boilerplate fix would otherwise reach callers days late.
    cooldown:
      default-days: 3
      exclude:
        - 'atdr/*'
    # Group all action bumps into one PR so they share a single CI run and can
    # never conflict with each other. The boilerplate pins move together too:
    # Dependabot counts each reusable workflow file as its own dependency.
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Every dependency is a devDependency and nothing is published, so no
    # bump changes what anyone installs.
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    # One PR for routine (minor/patch) bumps keeps package-lock.json conflicts
    # to a minimum; majors stay separate so they can be reviewed individually.
    groups:
      npm-minor:
        update-types:
          - 'minor'
          - 'patch'
